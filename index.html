<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枝繁葉茂 · 统计物理学基础</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --physics-blue: #4a7dff;
            --physics-light: #7ea8ff;
            --purple: #8a5cff;
            --music-purple: #a05cff;
            --music-light: #c9a2ff;
            --cancer-red: #ff6b81;
            --healthy-green: #34d399;
            --forest-green: #10b981;
            --research-orange: #ff9f5a;
            --gold: #ffd166;
            --deep-blue: #2b3a67;
            --ink: #33415c;
            --ink-soft: #5c6b8a;
            --glass: rgba(255, 255, 255, 0.62);
            --glass-border: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 20px 60px rgba(93, 120, 255, 0.12), 0 4px 16px rgba(93, 120, 255, 0.06);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(160deg, #eef4ff 0%, #f3efff 45%, #eafaf4 100%);
            font-family: 'Roboto', 'Noto Sans SC', sans-serif;
            line-height: 1.8;
            color: var(--ink);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        /* ===== 滚动条 ===== */
        ::selection {
            background: rgba(74, 125, 255, 0.25);
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--physics-light), var(--music-light));
            border-radius: 8px;
        }

        /* ===== 背景光晕 ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }
        .orb-1 {
            width: 480px;
            height: 480px;
            left: -140px;
            top: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(122, 162, 255, 0.6), transparent 70%);
            animation: drift1 26s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 420px;
            height: 420px;
            right: -120px;
            top: 16%;
            background: radial-gradient(circle at 60% 40%, rgba(178, 140, 255, 0.55), transparent 70%);
            animation: drift2 32s ease-in-out infinite alternate;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            left: 10%;
            bottom: -140px;
            background: radial-gradient(circle at 40% 60%, rgba(110, 231, 183, 0.5), transparent 70%);
            animation: drift3 30s ease-in-out infinite alternate;
        }
        .orb-4 {
            width: 320px;
            height: 320px;
            right: 20%;
            bottom: 10%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 170, 150, 0.4), transparent 70%);
            animation: drift2 38s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift1 {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(70px, 50px) scale(1.18);
            }
        }
        @keyframes drift2 {
            from {
                transform: translate(0, 0) scale(1.1);
            }
            to {
                transform: translate(-60px, 70px) scale(0.94);
            }
        }
        @keyframes drift3 {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(80px, -60px) scale(1.15);
            }
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #mouse-glow {
            position: fixed;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(122, 150, 255, 0.13), transparent 62%);
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .leaf-fall {
            position: fixed;
            top: -6vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            animation: leafFall linear infinite;
        }

        @keyframes leafFall {
            0% {
                transform: translate(0, -5vh) rotate(0deg);
            }
            25% {
                transform: translate(6vw, 24vh) rotate(95deg);
            }
            50% {
                transform: translate(-4vw, 52vh) rotate(200deg);
            }
            75% {
                transform: translate(5vw, 80vh) rotate(300deg);
            }
            100% {
                transform: translate(0, 110vh) rotate(390deg);
            }
        }

        /* ===== 页面主体 ===== */
        .page {
            position: relative;
            z-index: 1;
        }

        /* ===== 滚动渐显 ===== */
        .reveal {
            opacity: 0;
            transform: translateY(36px) scale(0.985);
            filter: blur(6px);
            transition: opacity 0.9s ease, transform 0.9s var(--smooth), filter 0.9s ease, box-shadow 0.6s ease;
            transition-delay: var(--d, 0s);
            will-change: opacity, transform;
        }
        .reveal.in {
            opacity: 1;
            transform: none;
            filter: none;
        }
        .reveal.revealed {
            transition: transform 0.35s var(--spring), box-shadow 0.6s ease;
        }

        /* ===== 头部 ===== */
        .header-container {
            position: relative;
            text-align: center;
            padding: 64px 24px 48px;
            margin: 26px 0 40px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-radius: 32px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .header-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--forest-green), var(--physics-blue), var(--cancer-red), var(--music-purple), var(--research-orange), var(--forest-green));
            background-size: 200% 100%;
            animation: ribbon 8s linear infinite;
        }

        @keyframes ribbon {
            from {
                background-position: 0% 0;
            }
            to {
                background-position: 200% 0;
            }
        }

        .header-halo {
            position: absolute;
            top: -110px;
            left: 50%;
            width: 420px;
            height: 420px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(122, 162, 255, 0.28), transparent 65%);
            border-radius: 50%;
            animation: breathe 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.6;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.12);
            }
        }

        h1 {
            position: relative;
            font-size: 3.2rem;
            margin-bottom: 18px;
            font-weight: 800;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 3px;
            display: inline-block;
            background: linear-gradient(90deg, #4a7dff, #8a5cff, #ff6b9a, #10b981, #4a7dff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmer 9s linear infinite;
        }

        @keyframes shimmer {
            from {
                background-position: 0% 0;
            }
            to {
                background-position: 300% 0;
            }
        }

        h1 .leaf-icon {
            -webkit-text-fill-color: initial;
            background: none;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--physics-blue), var(--purple), var(--music-purple), var(--physics-blue));
            background-size: 200% 100%;
            animation: ribbon 5s linear infinite;
        }

        .subtitle {
            color: var(--ink-soft);
            font-size: 1.55rem;
            max-width: 900px;
            margin: 12px auto 0;
            font-weight: 400;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 1px;
        }

        /* ===== 引言 ===== */
        .quote-container {
            max-width: 840px;
            margin: 38px auto 0;
            padding: 32px 36px 26px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 14px 44px rgba(93, 120, 255, 0.10);
            position: relative;
            text-align: left;
        }

        .quote-container::before {
            content: "\201C";
            position: absolute;
            top: -30px;
            left: 20px;
            font-size: 6rem;
            font-family: Georgia, serif;
            color: rgba(74, 125, 255, 0.16);
            line-height: 1;
        }

        .quote-text {
            font-style: italic;
            font-size: 1.05rem;
            color: var(--ink-soft);
            line-height: 2.05;
            font-family: 'Noto Serif SC', serif;
        }

        .quote-text+.quote-text {
            margin-top: 14px;
        }

        .quote-author {
            text-align: right;
            margin-top: 16px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--physics-blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* ===== 区块标题 ===== */
        .section-title {
            text-align: center;
            margin-bottom: 34px;
            font-size: 1.9rem;
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--physics-blue), var(--purple), var(--forest-green), var(--physics-blue));
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmer 10s linear infinite;
        }

        .section-title i {
            -webkit-text-fill-color: initial;
            margin-right: 6px;
        }

        .section-subtitle {
            text-align: center;
            margin: 42px 0 22px;
            font-size: 1.5rem;
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
        }

        /* ===== 卡片（玻璃拟态） ===== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(500px, 100%), 1fr));
            gap: 36px;
            margin: 50px 0;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-radius: 26px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            position: relative;
            border: 1px solid var(--glass-border);
            transition: transform 0.6s var(--smooth), box-shadow 0.6s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 34px 80px rgba(93, 120, 255, 0.20), 0 8px 24px rgba(93, 120, 255, 0.10);
        }

        .card-header {
            color: #fff;
            padding: 26px 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            background-size: 190% 190%;
            animation: hueDrift 9s ease-in-out infinite;
        }

        @keyframes hueDrift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .card-header::before {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 55%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            transition: left 0.9s ease;
        }

        .card:hover .card-header::before {
            left: 135%;
        }

        .card-header i {
            font-size: 2rem;
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            animation: bob 5s ease-in-out infinite;
        }

        @keyframes bob {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .card-header h2 {
            font-size: 1.45rem;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .card-body {
            padding: 30px;
        }

        /* ===== 卡片颜色主题 ===== */
        .physics-section .card-header {
            background-image: linear-gradient(120deg, #2b3a67, #4a7dff, #7ea8ff);
        }
        .energy-section .card-header {
            background-image: linear-gradient(120deg, #4c3a8f, #8a5cff, #c9a2ff);
        }
        .cancer-section .card-header {
            background-image: linear-gradient(120deg, #e05270, #ff8f6b, #ffb25a);
        }
        .research-section .card-header {
            background-image: linear-gradient(120deg, #e07a3f, #ff9f5a, #ffc46b);
        }
        .music-section .card-header {
            background-image: linear-gradient(120deg, #6c2bd9, #a05cff, #c9a2ff);
        }

        /* ===== 内部小盒 ===== */
        .model-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .model-box {
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.95);
            padding: 26px;
            border-radius: 18px;
            margin: 4px 0;
            box-shadow: 0 8px 24px rgba(93, 120, 255, 0.07);
            transition: transform 0.5s var(--spring), box-shadow 0.5s ease;
            position: relative;
        }

        .physics-section .model-box,
        .philosophy-section .model-box {
            border-left: 4px solid var(--physics-blue);
        }
        .energy-section .model-box {
            border-left: 4px solid var(--purple);
        }
        .cancer-section .model-box {
            border-left: 4px solid var(--cancer-red);
        }
        .research-section .model-box {
            border-left: 4px solid var(--research-orange);
        }

        .model-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 36px rgba(93, 120, 255, 0.13);
        }

        .model-title {
            color: var(--deep-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            font-size: 1.35rem;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }

        .model-title i {
            margin-right: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--physics-blue), var(--purple));
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.05rem;
            box-shadow: 0 8px 18px rgba(74, 125, 255, 0.35);
            animation: bob 5.5s ease-in-out infinite;
        }

        .cancer-section .model-title i,
        .research-section .model-title i {
            background: linear-gradient(135deg, var(--cancer-red), var(--research-orange));
            box-shadow: 0 8px 18px rgba(255, 140, 100, 0.35);
        }

        /* ===== 表格 ===== */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(93, 120, 255, 0.08);
            font-size: 0.95rem;
        }

        .comparison-table th {
            background: linear-gradient(120deg, #5b8cff, #8a5cff);
            background-size: 180% 180%;
            animation: hueDrift 8s ease-in-out infinite;
            color: white;
            padding: 16px 18px;
            text-align: left;
            font-weight: 500;
        }

        .comparison-table td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(93, 120, 255, 0.08);
            transition: background 0.3s ease;
        }

        .comparison-table tr:nth-child(even) {
            background-color: rgba(93, 120, 255, 0.03);
        }

        .comparison-table tbody tr:hover td {
            background-color: rgba(74, 125, 255, 0.07);
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .healthy-cell td {
            background-color: rgba(52, 211, 153, 0.08) !important;
        }
        .cancer-cell td {
            background-color: rgba(255, 107, 129, 0.08) !important;
        }

        /* ===== 能量流 ===== */
        .energy-flow {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 28px 0;
        }

        .flow-item {
            text-align: center;
            padding: 24px 18px;
            margin: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            min-width: 180px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            transition: transform 0.5s var(--spring), box-shadow 0.5s ease, border-color 0.4s ease;
            box-shadow: 0 10px 26px rgba(93, 120, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .flow-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--physics-blue), var(--purple));
        }

        .flow-item:nth-child(2)::before {
            background: linear-gradient(90deg, var(--purple), var(--music-purple));
        }
        .flow-item:nth-child(3)::before {
            background: linear-gradient(90deg, var(--forest-green), var(--healthy-green));
        }
        .flow-item:nth-child(4)::before {
            background: linear-gradient(90deg, var(--research-orange), var(--gold));
        }

        .flow-item:hover {
            transform: translateY(-9px) scale(1.04);
            box-shadow: 0 20px 44px rgba(93, 120, 255, 0.16);
            border-color: var(--physics-light);
        }

        .flow-icon {
            font-size: 2.6rem;
            margin: 10px 0 14px;
            background: linear-gradient(135deg, var(--physics-blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: bob 4.5s ease-in-out infinite;
        }

        .flow-item:nth-child(2) .flow-icon {
            animation-delay: 0.5s;
        }
        .flow-item:nth-child(3) .flow-icon {
            animation-delay: 1s;
        }
        .flow-item:nth-child(4) .flow-icon {
            animation-delay: 1.5s;
        }

        .flow-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--deep-blue);
            font-size: 1.15rem;
        }

        /* ===== 结语 / 哲学 ===== */
        .conclusion-section,
        .philosophy-section {
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(1.35);
            -webkit-backdrop-filter: blur(18px) saturate(1.35);
            border-radius: 26px;
            padding: 46px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .philosophy-section {
            margin: 50px 0;
            padding: 40px;
        }
        .conclusion-section {
            margin: 60px 0;
        }

        .conclusion-section::before,
        .philosophy-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--forest-green), var(--physics-blue), var(--cancer-red), var(--music-purple), var(--research-orange), var(--forest-green));
            background-size: 200% 100%;
            animation: ribbon 9s linear infinite;
        }

        .conclusion-section::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--research-orange), var(--music-purple), var(--cancer-red), var(--physics-blue), var(--forest-green), var(--research-orange));
            background-size: 200% 100%;
            animation: ribbon 9s linear infinite reverse;
        }

        .stage-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 28px;
            border-radius: 18px;
            margin: 26px 0;
            border-left: 4px solid var(--gold);
            box-shadow: 0 8px 24px rgba(255, 209, 102, 0.12);
            transition: transform 0.5s var(--spring), box-shadow 0.5s ease;
        }

        .stage-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(255, 209, 102, 0.2);
        }

        .insight-box {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-left: 5px solid var(--physics-blue);
            padding: 30px 32px 26px;
            margin: 34px 0;
            border-radius: 0 20px 20px 0;
            position: relative;
            box-shadow: 0 12px 32px rgba(93, 120, 255, 0.10);
            transition: transform 0.5s var(--spring), box-shadow 0.5s ease;
        }

        .insight-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 42px rgba(93, 120, 255, 0.16);
        }

        .insight-box::after {
            content: "\201C";
            position: absolute;
            top: -26px;
            left: 18px;
            font-size: 6rem;
            color: rgba(74, 125, 255, 0.12);
            font-family: Georgia, serif;
            line-height: 1;
        }

        .insight-text {
            font-style: italic;
            color: var(--ink-soft);
            line-height: 2;
            font-size: 1.12rem;
            font-family: 'Noto Serif SC', serif;
